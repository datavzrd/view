<!doctype html>
<html lang="en">
<head>
    <title>datavzrd report</title>
    <meta charset="UTF-8">
</head>

<body>
<script>
    function show(message) {
        const p = document.createElement("p");
        p.style.cssText = "font-family: sans-serif; margin: 2rem;";
        p.textContent = message;
        document.body.replaceChildren(p);
    }

    const incomplete = "This link seems to be incomplete. Please copy the whole link.";

    // Use the bundle of the datavzrd version that created the link
    const version = new URLSearchParams(window.location.search).get("version");
    if (/^\d+\.\d+\.\d+$/.test(version)) {
        const script = document.createElement("script");
        script.src = `static/v${version}/bundle.js`;
        script.onload = () => {
            if (!datavzrd.load_shared) {
                show(`This link was created with datavzrd ${version}, which is no longer supported. Please create a new link with a newer datavzrd version.`);
                return;
            }
            try {
                datavzrd.load_shared();
            } catch (e) {
                show(incomplete);
            }
        };
        script.onerror = () => show(`Could not load datavzrd version ${version}.`);
        document.body.appendChild(script);
    } else {
        show(incomplete);
    }
</script>
</body>
</html>
